<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roki Coin Click</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    font-size: 28px;
}

.box {
    background: #1e293b;
    padding: 20px;
    border-radius: 20px;
    margin-top: 20px;
}

.coin {
    width: 180px;
    height: 180px;
    margin: 30px auto;
    border-radius: 50%;
    background: gold;
    color: black;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: bold;
}

#coins {
    font-size: 40px;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>🪙 Roki Coin Click</h1>

<div class="box">

    <div>তোমার কয়েন</div>

    <div id="coins">0</div>

    <div class="coin">
        TAP
    </div>

    <p>প্রতি TAP = +1 Coin</p>

    <p>⚡ Energy: 100 / 100</p>

    <p>⭐ Level: 1</p>

    <p>🎯 Missions</p>

    <p>100 Coins — 🔒</p>

    <p>500 Coins — 🔒</p>

    <p>1000 Coins — 🔒</p>

    <p>🏆 Achievements</p>

    <p>🎁 Daily Bonus</p>

</div>

</body>
</html>
