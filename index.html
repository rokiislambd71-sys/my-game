<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roki Coin Click</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg,#111827,#1e1b4b);
    color: white;
    font-family: Arial,sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
}

.container {
    width: 92%;
    max-width: 420px;
    text-align: center;
}

h1 {
    color: #00d2ff;
    font-size: 28px;
    margin-bottom: 5px;
}

.subtitle {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 20px;
}

.card {
    background: rgba(255,255,255,0.07);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

.coin-title {
    font-size: 15px;
    color: #aaa;
}

.score {
    font-size: 38px;
    font-weight: bold;
    color: #ffe066;
    margin: 5px 0 15px;
}

.coin {
    width: 190px;
    height: 190px;
    margin: 10px auto 20px;
    border-radius: 50%;

    background:
        radial-gradient(circle at 35% 30%,
        #fff3a3,
        #ffd43b 45%,
        #f59e0b);

    border: 8px solid #fff7c2;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 70px;

    box-shadow:
        0 10px 35px rgba(245,158,11,.45);

    cursor: pointer;

    transition: transform .08s;
}

.coin:active {
    transform: scale(.91);
}

.tap-text {
    color: #aaa;
    font-size: 13px;
    margin-bottom: 15px;
}

button {
    width: 100%;
    border: none;
    border-radius: 30px;
    padding: 15px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.ad-btn {
    background: linear-gradient(90deg,#00d2ff,#00b4db);
    color: #111;
}

.bonus-btn {
    background: linear-gradient(90deg,#facc15,#f59e0b);
    color: #111;
}

button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.info {
    margin-top: 15px;
    padding: 12px;
    background: rgba(255,255,255,.05);
    border-radius: 12px;
    font-size: 13px;
    color: #aaa;
}

.status {
    min-height: 22px;
    margin-top: 12px;
    font-size: 13px;
    color: #00d2ff;
}

.footer {
    margin-top: 15px;
    font-size: 11px;
    color: #666;
}

</style>
</head>

<body>

<div class="container">

    <h1>🪙 Roki Coin Click</h1>

    <div class="subtitle">
        কয়েনে ট্যাপ করুন এবং বোনাস সংগ্রহ করুন
    </div>

    <div class="card">

        <div class="coin-title">
            আপনার Coin
        </div>

        <div class="score">
            <span id="score">0</span>
        </div>

        <div class="coin" id="coin">
            🪙
        </div>

        <div class="tap-text">
            কয়েনে ট্যাপ করলে +1 Coin
        </div>

        <button
            class="ad-btn"
            id="adButton">
            📺 বিজ্ঞাপন দেখুন
            <br>
            <small>সম্পূর্ণ বিজ্ঞাপন = +10 Coin</small>
        </button>

        <button
            class="bonus-btn"
            id="dailyButton">
            🎁 Daily Bonus
        </button>

        <div class="info">
            💰 Coin সংগ্রহ করুন<br>
            📺 বিজ্ঞাপন দেখে Bonus নিন<br>
            🎁 প্রতিদিন Bonus সংগ্রহ করুন
        </div>

        <div
            class="status"
            id="status">
        </div>

    </div>

    <div class="footer">
        Coin বর্তমানে গেমের অভ্যন্তরীণ পয়েন্ট।
    </div>

</div>

<script>

/* =====================================
   Telegram Mini App
===================================== */

const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
}


/* =====================================
   Elements
===================================== */

const scoreDisplay =
    document.getElementById("score");

const coin =
    document.getElementById("coin");

const adButton =
    document.getElementById("adButton");

const dailyButton =
    document.getElementById("dailyButton");

const status =
    document.getElementById("status");


/* =====================================
   Load Saved Coin
===================================== */

let score =
    Number(localStorage.getItem("rokiCoin")) || 0;

scoreDisplay.textContent = score;


/* =====================================
   Save Coin
===================================== */

function saveScore() {

    localStorage.setItem(
        "rokiCoin",
        score
    );

}


/* =====================================
   Update Score
===================================== */

function updateScore(amount) {

    score += amount;

    scoreDisplay.textContent =
        score;

    saveScore();

}


/* =====================================
   Coin Click
===================================== */

coin.addEventListener(
    "click",
    function() {

        updateScore(1);

        status.textContent =
            "+1 Coin";

    }
);


/* =====================================
   AdsGram
   Block ID: 51244
===================================== */

let AdController = null;

try {

    if (
        window.Adsgram &&
        typeof window.Adsgram.init === "function"
    ) {

        AdController =
            window.Adsgram.init({
                blockId: "51244"
            });

    } else {

        status.textContent =
            "AdsGram প্রস্তুত নয়।";

    }

} catch (error) {

    console.error(
        "AdsGram error:",
        error
    );

    status.textContent =
        "AdsGram চালু করা যায়নি।";
}


/* =====================================
   Show Advertisement
===================================== */

adButton.addEventListener(
    "click",
    async function() {

        if (!AdController) {

            status.textContent =
                "বিজ্ঞাপন সিস্টেম প্রস্তুত নয়।";

            return;
        }

        adButton.disabled = true;

        status.textContent =
            "📺 বিজ্ঞাপন লোড হচ্ছে...";

        try {

            const result =
                await AdController.show();


            if (
                result &&
                result.done === true
            ) {

                updateScore(10);

                status.textContent =
                    "🎉 বিজ্ঞাপন সম্পূর্ণ! +10 Coin";

            } else {

                status.textContent =
                    "বিজ্ঞাপন সম্পূর্ণ হয়নি।";

            }

        } catch (error) {

            console.error(
                "AdsGram show error:",
                error
            );

            status.textContent =
                "এই মুহূর্তে বিজ্ঞাপন পাওয়া যাচ্ছে না।";

        } finally {

            adButton.disabled = false;

        }

    }
);


/* =====================================
   Daily Bonus
===================================== */

dailyButton.addEventListener(
    "click",
    function() {

        const today =
            new Date().toISOString().split("T")[0];

        const lastBonus =
            localStorage.getItem(
                "rokiDailyBonus"
            );


        if (lastBonus === today) {

            status.textContent =
                "🎁 আজকের Bonus ইতিমধ্যে নেওয়া হয়েছে।";

            return;
        }


        updateScore(20);


        localStorage.setItem(
            "rokiDailyBonus",
            today
        );


        status.textContent =
            "🎁 Daily Bonus! +20 Coin";

    }
);


/* =====================================
   Initial Message
===================================== */

if (score === 0) {

    status.textContent =
        "🪙 শুরু করতে কয়েনে ট্যাপ করুন।";

}

</script>

</body>
</html>
