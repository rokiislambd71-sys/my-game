<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roki Coin Click</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#101827;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin-top:20px;
}

.coins{
    font-size:38px;
    font-weight:bold;
    margin:25px 0;
}

#coin{
    width:190px;
    height:190px;
    margin:20px auto;
    border-radius:50%;
    background:#facc15;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    font-weight:bold;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    cursor:pointer;
}

#coin:active{
    transform:scale(.94);
}

.info{
    margin-top:20px;
    color:#cbd5e1;
}
</style>
</head>

<body>

<h1>🪙 Roki Coin Click</h1>

<div class="coins">
    🪙 <span id="coins">0</span>
</div>

<div id="coin">
    TAP
</div>

<div class="info">
    প্রতি Tap = +1 Coin
</div>

<script>

let coins = Number(
    localStorage.getItem("rokiCoins") || 0
);

if(!Number.isFinite(coins)){
    coins = 0;
}

const coinsElement =
    document.getElementById("coins");

const coinButton =
    document.getElementById("coin");


function updateCoins(){

    coinsElement.textContent =
        coins;

}


function addCoin(event){

    if(event){
        event.preventDefault();
    }

    coins = coins + 1;

    localStorage.setItem(
        "rokiCoins",
        String(coins)
    );

    updateCoins();

}


coinButton.addEventListener(
    "click",
    addCoin
);


coinButton.addEventListener(
    "touchend",
    addCoin,
    {passive:false}
);


updateCoins();

</script>

</body>
</html>
