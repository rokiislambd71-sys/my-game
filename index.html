body{

    min-height:100vh;

    color:white;
    background:linear-gradient(160deg,#07111f,#102a43,#08111d);
}

.container{

    max-width:500px;
    margin:auto;

.header{
    text-align:center;

.balance{

.balance-title{

.balance-number{

}

.stat strong{
    font-size:18px;
}

.coin-area{
    text-align:center;
    padding:10px 0 4px;

    align-items:center;
    justify-content:center;
    font-size:35px;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    box-shadow:0 12px 35px rgba(0,0,0,.4);
}

.coin-button:active{
    transform:scale(.94);
}

.tap-help{
    color:#a9bdd0;
    font-size:14px;
}
