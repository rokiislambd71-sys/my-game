<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roki Coin Click</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #111827, #1e1b4b);
    color: white;
    font-family: Arial, sans-serif;
    user-select: none;
}

.container {
    width: 92%;
    max-width: 430px;
    margin: auto;
    padding: 18px 0 30px;
}

.header {
    text-align: center;
    margin-bottom: 15px;
}

h1 {
    margin: 0;
    color: #00d2ff;
    font-size: 28px;
}

.subtitle {
    color: #aaa;
    font-size: 13px;
    margin-top: 6px;
}

.card {
    background: rgba(255,255,255,0.07);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 8px 25px rgba(0,0,0,.22);
}

.title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
}

.score-label {
    color: #aaa;
    font-size: 13px;
    text-align: center;
}

.score {
    text-align: center;
    color: #ffe066;
    font-size: 42px;
    font-weight: bold;
    margin: 3px 0;
}

.level {
    text-align: center;
    color: #00d2ff;
    font-weight: bold;
    margin-bottom: 10px;
}

.coin {
    width: 185px;
    height: 185px;
    margin: 15px auto 12px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fff7b2,
            #ffd43b 45%,
            #f59e0b
        );

    border: 8px solid #fff7c2;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 70px;

    box-shadow:
        0 10px 35px rgba(245,158,11,.45);

    cursor: pointer;

    transition: transform .08s;
}

.coin:active {
    transform: scale(.91);
}

.tap-info {
    text-align: center;
    color: #aaa;
    font-size: 13px;
}

.progress-bg {
    width: 100%;
    height: 12px;
    background: rgba(255,255,255,.12);
    border-radius: 20px;
    overflow: hidden;
    margin: 8px 0;
}

.progress {
    height: 100%;
    width: 0%;
    background: linear-gradient(
        90deg,
        #00d2ff,
        #00b4db
    );
    transition: width .2s;
}

.small {
    color: #aaa;
    font-size: 12px;
}

.mission {
    background: rgba(255,255,255,.05);
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 9px;
}

.mission:last-child {
    margin-bottom: 0;
}

.mission-name {
    font-weight: bold;
    margin-bottom: 4px;
}

.mission-status {
    font-size: 12px;
    color: #aaa;
}

.achievement {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 11px;
    margin-bottom: 8px;

    background: rgba(255,255,255,.05);
    border-radius: 12px;
}

.achievement:last-child {
    margin-bottom: 0;
}

.locked {
    opacity: .45;
}

.unlocked {
    opacity: 1;
}

button {
    width: 100%;
    border: none;
    border-radius: 30px;

    padding: 14px;

    margin-top: 9px;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

button:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.daily {
    background: linear-gradient(
        90deg,
        #facc15,
        #f59e0b
    );

    color: #111;
}

.ad-button {
    background: linear-gradient(
        90deg,
        #00d2ff,
        #00b4db
    );

    color: #111;
}

.combo-box {
    text-align: center;
}

.combo {
    font-size: 22px;
    color: #facc15;
    font-weight: bold;
}

.status {
    min-height: 22px;
    margin-top: 10px;

    text-align: center;

    color: #00d2ff;
    font-size: 13px;
}

.info {
    color: #aaa;
    font-size: 12px;
    line-height: 1.6;
}

.ad-location {
    background: rgba(0,210,255,.08);
    border: 1px solid rgba(0,210,255,.2);

    padding: 10px;
    border-radius: 10px;

    color: #aaa;
    font-size: 12px;

    margin-top: 10px;
}

.footer {
    text-align: center;
    color: #666;
    font-size: 11px;
    margin-top: 15px;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>🪙 Roki Coin Click</h1>

        <div class="subtitle">
            Coin সংগ্রহ করুন এবং নিজের Level বাড়ান
        </div>

    </div>


    <div class="card">

        <div class="score-label">
            আপনার Coin
        </div>

        <div class="score">
            <span id="score">0</span>
        </div>

        <div class="level">
            ⭐ Level <span id="level">1</span>
        </div>


        <div class="coin" id="coin">
            🪙
        </div>


        <div class="tap-info">
            কয়েনে ট্যাপ করলে +1 Coin
        </div>


        <div class="status" id="status"></div>

    </div>


    <div class="card">

        <div class="title">
            📈 Level Progress
        </div>

        <div class="small">
            পরবর্তী Level:
            <b id="nextLevel">100</b> Coin
        </div>

        <div class="progress-bg">

            <div
                class="progress"
                id="levelProgress">
            </div>

        </div>

        <div class="small">
            Level বাড়াতে Coin সংগ্রহ করুন।
        </div>

    </div>


    <div class="card combo-box">

        <div class="title">
            ⚡ Tap Combo
        </div>

        <div class="combo">
            x<span id="combo">0</span>
