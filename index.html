<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roki Crypto Clicker</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e1e2f, #111110);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #00d2ff;
        }
        .score-box {
            font-size: 32px;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 0 10px #00d2ff;
        }
        .coin {
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, #ffe066, #f5b041);
            border-radius: 50%;
            margin: 30px auto;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(245, 176, 65, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            transition: transform 0.1s ease;
            border: 8px solid #fcf3cf;
        }
        .coin:active {
            transform: scale(0.95);
        }
        .ad-btn {
            background-color: #00d2ff;
            color: #111;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
            transition: background 0.3s;
        }
        .ad-btn:hover {
            background-color: #00b4db;
        }
    </style>
    <!-- টেলিগ্রাম মিনি অ্যাপ লাইব্রেরি -->
    <script src="https://telegram.org"></script>
</head>
<body>

    <div class="container">
        <h1>Roki Crypto Clicker</h1>
        
        <!-- স্কোর দেখানোর বক্স -->
        <div class="score-box">Score: <span id="score">0</span></div>
        
        <!-- বড় গোল কয়েন বাটন -->
        <div class="coin" onclick="handleCoinClick()">🪙</div>

        <!-- প্লে এবং অ্যাড বাটন -->
        <button class="ad-btn" onclick="watchAd()">Play & Earn / Watch Ad 💸</button>
    </div>

    <script>
        let score = 0;
        const scoreDisplay = document.getElementById('score');

        // কয়েন ক্লিকের মাধ্যমে স্কোর বাড়ানোর ফাংশন
        function handleCoinClick() {
            score += 1;
            scoreDisplay.innerText = score;
        }

        // অ্যাড লিংক ওপেন করার ফাংশন
        function watchAd() {
            // নিচের কোটেশনের ভেতরে আপনার ইনকামের আসল অ্যাড লিংকটি বসিয়ে দেবেন
            const myAdLink = "এখানে_আপনার_অ্যাড_লিংক_বসান"; 
            
            if(myAdLink !== "এখানে_আপনার_অ্যাড_লিংক_বসান") {
                window.open(myAdLink, '_blank');
            } else {
                alert("দয়া করে কোডের ১০০ নম্বর লাইনে আপনার অ্যাড ডিরেক্ট লিংকটি বসান!");
            }
        }

        // টেলিগ্রাম মিনি অ্যাপ সচল করা
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
