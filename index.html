<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roki Crypto Clicker | রকি ক্রিপ্টো ক্লিকার</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e1e2f, #111110);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            color: #00d2ff;
            font-weight: bold;
        }
        .subtitle {
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 15px;
        }
        .score-box {
            font-size: 30px;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 0 10px #00d2ff;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 15px;
            border: 1px solid rgba(0, 210, 255, 0.2);
        }
        .coin {
            width: 190px;
            height: 190px;
            background: radial-gradient(circle, #ffe066, #f5b041);
            border-radius: 50%;
            margin: 25px auto;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(245, 176, 65, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            transition: transform 0.08s ease;
            border: 8px solid #fcf3cf;
        }
        .coin:active {
            transform: scale(0.92);
        }
        .ad-btn {
            background: linear-gradient(90deg, #00d2ff, #00b4db);
            color: #111;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.4);
            transition: all 0.3s ease;
            width: 100%;
        }
        .ad-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(0, 210, 255, 0.2);
        }
    </style>
    <!-- টেলিগ্রাম মিনি অ্যাপ লাইব্রেরি -->
    <script src="https://telegram.org"></script>
</head>
<body>

    <div class="container">
        <!-- গেমের নাম (ইংরেজি ও বাংলা) -->
        <h1>Roki Crypto Clicker</h1>
        <div class="subtitle">কয়েনে ক্লিক করুন এবং ইনকাম করুন</div>
        
        <!-- স্কোর দেখানোর বক্স (ইংরেজি ও বাংলা) -->
        <div class="score-box">Score / স্কোর: <span id="score">0</span></div>
        
        <!-- বড় গোল কয়েন বাটন -->
        <div class="coin" onclick="handleCoinClick()">🪙</div>

        <!-- প্লে এবং অ্যাড বাটন (ইংরেজি ও বাংলা) -->
        <button class="ad-btn" onclick="watchAd()">Play & Earn / অ্যাড দেখে ইনকাম 💸</button>
    </div>

    <script>
        let score = 0;
        const scoreDisplay = document.getElementById('score');

        // কয়েন ক্লিক করার ফাংশন
        function handleCoinClick() {
            score += 1;
            scoreDisplay.innerText = score;
        }

        // অটোমেটিক স্মার্ট অ্যাড লিংক চালু করার ফাংশن
        function watchAd() {
            // এটি একটি সেফ ডাইরেক্ট রিডাইরেক্ট মেকানিজম যা আপনার ট্রাফিককে অ্যাড পেজে নিয়ে যাবে
            const securePortal = "https://google.com"; 
            window.open(securePortal, '_blank');
        }

        // টেলিগ্রাম মিনি অ্যাপ সচল করা
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    </script>
</body>
</html>
