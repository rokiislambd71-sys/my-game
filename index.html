<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roki Coin Click</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(180deg,#111827,#020617);
    color:white;
    min-height:100vh;
    text-align:center;
    padding:20px 14px;
}

.container{
    max-width:430px;
    margin:auto;
}

h1{
    margin:5px 0 18px;
    font-size:28px;
}

.card{
    background:#1e293b;
    border-radius:20px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.balance-title{
    font-size:15px;
    opacity:.75;
}

.balance{
    font-size:42px;
    font-weight:bold;
    margin:5px 0;
}

.level{
    font-size:16px;
    margin-top:5px;
}

.coin{
    width:210px;
    height:210px;
    margin:25px auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(145deg,#facc15,#eab308);
    color:#422006;
    font-size:34px;
    font-weight:bold;
    border:8px solid #fde68a;
    box-shadow:0 12px 30px rgba(234,179,8,.35);
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    transition:transform .08s;
}

.coin:active{
    transform:scale(.94);
}

.energy-text{
    margin-bottom:8px;
}

.energy-bar{
    height:14px;
    background:#334155;
    border-radius:20px;
    overflow:hidden;
}

.energy-fill{
    height:100%;
    width:100%;
    background:#22c55e;
    transition:width .2s;
}

.progress-bg{
    height:12px;
    background:#334155;
    border-radius:20px;
    overflow:hidden;
    margin-top:8px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#38bdf8;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid #334155;
}

.row:last-child{
    border-bottom:none;
}

button{
    border:0;
    border-radius:12px;
    padding:9px 14px;
    background:#22c55e;
    color:#052e16;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#475569;
    color:#cbd5e1;
}

.small{
    font-size:13px;
    opacity:.7;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

    <h1>🪙 Roki Coin Click</h1>

    <div class="card">
        <div class="balance-title">তোমার কয়েন</div>
        <div class="balance" id="coins
